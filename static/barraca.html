<!doctype html><html lang="pt-br"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barraca · Correio Elegante</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--noite:#15173a;--kraft:#f3e7cf;--fogueira:#ff7a2d;--brasa:#ff3d3d;--milho:#ffc83d;
    --verde:#3ec46d;--azul:#43b3ff;--rosa:#ff6fae;--tinta:#23224a;--tinta-2:#52527a;--linha:rgba(35,34,74,.12)}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:"Outfit",system-ui,sans-serif;color:var(--tinta);min-height:100vh;
    background:radial-gradient(1200px 500px at 80% -10%,#2a2c66 0,transparent 60%),var(--noite);padding:20px}
  .bandeirinhas{height:22px;display:flex;overflow:hidden;border-radius:6px;margin-bottom:18px}
  .bandeirinhas i{flex:1 0 22px;height:22px;clip-path:polygon(0 0,100% 0,50% 100%)}
  .bandeirinhas i:nth-child(5n+1){background:var(--brasa)}.bandeirinhas i:nth-child(5n+2){background:var(--milho)}
  .bandeirinhas i:nth-child(5n+3){background:var(--verde)}.bandeirinhas i:nth-child(5n+4){background:var(--azul)}
  .bandeirinhas i:nth-child(5n+5){background:var(--rosa)}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-family:"Rye",serif;color:var(--milho);font-weight:400;font-size:28px;text-align:center;margin:0 0 4px;
    text-shadow:0 2px 0 #b8431b}
  .sub{text-align:center;color:var(--kraft);opacity:.7;font-size:14px;margin-bottom:20px}
  .cartao{background:var(--kraft);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(21,23,58,.18);position:relative;overflow:hidden}
  .cartao::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;
    background:linear-gradient(90deg,var(--brasa),var(--milho),var(--verde),var(--azul),var(--rosa))}
  label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
  input,textarea{width:100%;font:inherit;font-size:16px;padding:12px 13px;border-radius:11px;border:1.5px solid var(--linha);background:#fff;color:var(--tinta)}
  input:focus,textarea:focus{outline:none;border-color:var(--fogueira);box-shadow:0 0 0 3px rgba(255,122,45,.18)}
  textarea{resize:vertical;min-height:80px}
  .linha-anon{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:600;font-size:14px}
  .linha-anon input{width:auto}
  .botao{margin-top:18px;width:100%;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:17px;color:#fff;
    padding:14px;border-radius:13px;background:linear-gradient(180deg,var(--rosa),#e2528d);box-shadow:0 8px 18px rgba(226,82,141,.35)}
  .botao:active{transform:translateY(1px)}
  .dica{color:var(--tinta-2);font-size:12px;margin:8px 2px 0}
  /* resultado */
  #resultado{display:none;text-align:center;margin-top:18px;animation:sobe .3s ease}
  #resultado .cod{font-family:"Rye",serif;color:var(--brasa);font-size:32px}
  #resultado .via{display:inline-block;margin:8px 0;padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px}
  .via.tg{background:#d6ecff;color:#1d6fd1}.via.lk{background:#fff0cf;color:#9a6b00}.via.mod{background:#ffd9d9;color:#c23a0e}
  #qr{display:flex;justify-content:center;margin:12px 0}#qr canvas,#qr img{background:#fff;padding:10px;border-radius:12px}
  #resultado a.link{display:block;color:var(--tinta-2);font-size:12px;word-break:break-all;margin-top:6px}
  .novo{margin-top:14px;background:#fff;border:1.5px solid var(--linha);border-radius:11px;padding:11px;font:inherit;font-weight:700;cursor:pointer;width:100%}
  @keyframes sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></head><body>
<div class="wrap">
  <div class="bandeirinhas" id="band"></div>
  <h1>Correio Elegante</h1>
  <div class="sub">Barraca · Turma de TI</div>
  <div class="cartao">
    <div id="form">
      <label for="para">Para quem é? (nome, turma ou @ do Telegram)</label>
      <input id="para" placeholder="Ex.: Ana 3ºB  ou  @ana" autocomplete="off" />
      <label for="msg">Mensagem</label>
      <textarea id="msg" placeholder="Escreva o correio…"></textarea>
      <label for="de">De (como aparece pra quem recebe)</label>
      <input id="de" placeholder="Seu nome (ou deixe anônimo)" autocomplete="off" />
      <label for="remetente">Quem está enviando? <span style="color:var(--brasa)">*</span>
        <small style="font-weight:400;color:var(--tinta-2)">— registro interno, ninguém vê</small></label>
      <input id="remetente" placeholder="Seu nome e turma, ex.: Luiz 3ºA" autocomplete="off" />
      <div class="linha-anon">
        <input type="checkbox" id="anon" checked />
        <label for="anon" style="margin:0">Enviar anônimo 🎭</label>
      </div>
      <button class="botao" id="enviar">Gerar correio 💌</button>
      <p class="dica">🔒 Anônimo só pra quem recebe. A organização registra quem enviou, por segurança.</p>
      <p class="dica">Se a pessoa ativou o bot do Telegram, chega no celular dela na hora. Senão, entregue o código/QR.</p>
    </div>
    <div id="resultado">
      <div class="cod" id="r-cod">CE-0000</div>
      <div class="via" id="r-via">—</div>
      <div id="qr"></div>
      <a class="link" id="r-link" href="#" target="_blank">—</a>
      <button class="novo" id="novo">+ Novo correio</button>
    </div>
  </div>
</div>
<script>
  const band=document.getElementById("band");for(let i=0;i<24;i++)band.appendChild(document.createElement("i"));
  const $=id=>document.getElementById(id);

  $("anon").addEventListener("change",()=>{ $("de").disabled=$("anon").checked; });
  $("de").disabled=true;

  $("enviar").onclick=async()=>{
    const para=$("para").value.trim(), msg=$("msg").value.trim(), remetente=$("remetente").value.trim();
    if(!para||!msg){ alert("Preencha o destinatário e a mensagem."); return; }
    if(!remetente){ alert("Identifique quem está enviando (registro interno)."); $("remetente").focus(); return; }
    $("enviar").disabled=true; $("enviar").textContent="Gerando…";
    try{
      const r=await fetch("/api/correios",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({para,mensagem:msg,de:$("de").value.trim(),
          anonimo:$("anon").checked,remetente_real:remetente})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.detail||"erro");
      mostrar(d);
    }catch(e){ alert("Deu erro: "+e.message); }
    $("enviar").disabled=false; $("enviar").textContent="Gerar correio 💌";
  };

  function mostrar(d){
    $("form").style.display="none"; $("resultado").style.display="block";
    $("r-cod").textContent=d.codigo;
    const via=$("r-via");
    if(d.oculto){ via.className="via mod"; via.textContent="⚠️ Retido p/ moderação"; }
    else if(d.telegram){ via.className="via tg"; via.textContent="✅ Enviado no Telegram!"; }
    else { via.className="via lk"; via.textContent="📲 Entregue por QR / link"; }
    $("qr").innerHTML="";
    if(!d.oculto && window.QRCode) new QRCode($("qr"),{text:d.link,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});
    $("r-link").textContent=d.link; $("r-link").href=d.link;
  }
  $("novo").onclick=()=>{
    ["para","msg","de","remetente"].forEach(id=>$(id).value="");
    $("anon").checked=true; $("de").disabled=true;
    $("resultado").style.display="none"; $("form").style.display="block"; $("para").focus();
  };
</script></body></html>
